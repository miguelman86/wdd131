<!DOCTYPE html>

<head>

<title>Contato - Descubra Brasil</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<script src="scripts/main.js" defer></script>
</head>
<body>
<header>
<div class="logo">Descubra Brasil</div>
<button id="menuBtn" aria-label="Abrir menu">☰</button>
<nav><ul id="navList"><li><a href="index.html">Home</a></li><li><a href="destinos.html">Destinos</a></li><li><a href="contato.html" class="active">Contato</a></li></ul></nav>
</header>
<main class="container">
<h1>Fale Conosco</h1>
<p>Quer sugerir um destino ou tirar dúvidas? Preencha o formulário.</p>
<form id="formContato">
<label for="nome">Nome *</label><input type="text" id="nome" name="nome" required>
<label for="email">E-mail *</label><input type="email" id="email" name="email" required>
<label for="interesse">Interesse</label><select id="interesse" name="interesse"><option>Praias</option><option>Cidades Históricas</option><option>Parques Naturais</option><option>Gastronomia</option><option>Outro</option></select>
<label for="mensagem">Mensagem *</label><textarea id="mensagem" name="mensagem" rows="5" required></textarea>
<button type="submit" class="btn">Enviar Mensagem</button>
</form>
<div id="mensagemSucesso" style="margin-top:1rem;"></div>
<p id="contadorFavoritos" style="margin-top:1rem;"></p>
</main>
<footer><p>&copy; 2026 Descubra Brasil | <a href="referencias.html">Referências</a></p></footer>
</body>
</html>

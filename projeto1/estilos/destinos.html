<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinos - Descubra Brasil</title>
    <meta name="description" content="Guia completo dos destinos turísticos do Brasil por região: história, o que fazer, melhor época e dicas locais">
    <meta name="author" content="Miguel Jose Mansilla Avilla">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/base.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">Descubra Brasil</div>
        <button id="menuBtn" aria-label="Abrir menu">☰</button>
        <nav>
            <ul id="navList">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinos.html" class="active">Destinos</a></li>
                <li><a href="cultura.html">Cultura e Gastronomia</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" style="padding:2rem 1rem;">
        <h1>Destinos Turísticos - Guia Completo</h1>
        <p>Clique em <strong>Ver detalhes completos</strong> em cada card para história, como chegar, melhor época e roteiros práticos</p>
        <div><span id="visitas" class="visits"></span></div>
    </section>

    <main class="container">
        <p id="contadorFavoritos"></p>
        <div class="filters">
            <select id="filtroRegiao">
                <option value="todos">Todas as Regiões</option>
                <option value="Norte">Norte</option>
                <option value="Nordeste">Nordeste</option>
                <option value="Centro-Oeste">Centro-Oeste</option>
                <option value="Sudeste">Sudeste</option>
                <option value="Sul">Sul</option>
            </select>
            <select id="filtroEstado">
                <option value="todos">Todos os Estados</option>
            </select>
            <select id="filtroTipo">
                <option value="todos">Todos os Tipos</option>
                <option value="Praia">Praia</option>
                <option value="Cidade Histórica">Cidade Histórica</option>
                <option value="Parque Natural">Parque Natural</option>
            </select>
        </div>
        <p id="totalResultados"></p>
        <div id="listaDestinos" class="grid"></div>
    </main>

    <!-- MODAL DETALHES DO DESTINO -->
    <div id="modalDestino" class="modal-overlay" aria-hidden="true">
        <div class="modal-box">
            <button id="fecharModal" class="modal-close" aria-label="Fechar">✕</button>
            <div id="modalConteudo"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Descubra Brasil | Feito com ❤️ para mostrar o Brasil</p>
    </footer>
</body>
</html>
